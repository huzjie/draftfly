apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: draftfly
  namespace: draftfly
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: draftfly
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
