apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "draftfly.fullname" . }}
  labels:
    {{- include "draftfly.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "draftfly.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "draftfly.labels" . | nindent 8 }}
    spec:
      containers:
        - name: draftfly
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "draftfly", "serve"]
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "draftfly.fullname" . }}
