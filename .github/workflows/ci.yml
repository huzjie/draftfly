name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check
        run: python -m compileall -q draftfly

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Doctor self-check
        run: python -m draftfly doctor

      - name: Run examples smoke
        run: python scripts/run_examples.py
