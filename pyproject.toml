[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "draftfly"
version = "1.0.0"
description = "Speculative decoding acceleration engine: draft-model generation + target-model parallel verification with rejection sampling, adaptive K, KV-cache reuse and sparse index."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "draftfly" }]
keywords = ["speculative-decoding", "llm", "inference", "draft-model", "acceleration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/huzjie/draftfly"

[tool.setuptools]
packages = ["draftfly", "draftfly.engine", "draftfly.models", "draftfly.api", "draftfly.util"]
